<!-- @dsCard group="Colors" viewport="700x170" name="Surfaces & borders" subtitle="Page, sheet, inverse, sunken; frame vs hair" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--paper)}.mono{font-family:var(--font-mono);font-size:11px;color:var(--grey-700)}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border:1px solid var(--grey-200)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--surface-page)"></div><div class="mono">surface-page<br>→ paper</div></div><div class="sw"><div class="chip" style="background:var(--surface-sheet)"></div><div class="mono">surface-sheet<br>→ white</div></div><div class="sw"><div class="chip" style="background:var(--surface-sunken)"></div><div class="mono">surface-sunken<br>→ grey-100</div></div><div class="sw"><div class="chip" style="background:var(--surface-inverse)"></div><div class="mono">surface-inverse<br>→ ink</div></div><div class="sw"><div class="chip" style="background:var(--white);border:var(--border-frame) solid var(--ink)"></div><div class="mono">border-frame-color<br>→ ink</div></div><div class="sw"><div class="chip" style="background:var(--white);border:1px solid var(--grey-200)"></div><div class="mono">border-hair-color<br>→ grey-200</div></div></div></body></html>
