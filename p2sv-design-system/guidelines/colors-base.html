<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--paper)}.mono{font-family:var(--font-mono);font-size:11px;color:var(--grey-700)}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border:1px solid var(--grey-200)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--ink)"></div><div class="mono"><b style="color:var(--ink)">ink</b><br>#111111<br>18.1:1</div></div><div class="sw"><div class="chip" style="background:var(--ink-2)"></div><div class="mono"><b style="color:var(--ink)">ink-2</b><br>#2b2b2a<br>12:1</div></div><div class="sw"><div class="chip" style="background:var(--paper)"></div><div class="mono"><b style="color:var(--ink)">paper</b><br>#FAFAF8<br>page</div></div><div class="sw"><div class="chip" style="background:var(--white)"></div><div class="mono"><b style="color:var(--ink)">white</b><br>#FFFFFF<br>sheet</div></div></div></body></html>
