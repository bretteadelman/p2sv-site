<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--paper)}.mono{font-family:var(--font-mono);font-size:11px;color:var(--grey-700)}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border:1px solid var(--grey-200)}</style></head><body><div style="display:flex;gap:28px;align-items:center"><a href="#" style="font-size:18px">Hover me — underline 1→2px</a><button style="font:inherit;font-variant:small-caps;letter-spacing:.06em;font-size:16px;text-transform:lowercase;background:var(--ink);color:var(--paper);border:1.5px solid var(--ink);border-radius:0;padding:10px 20px;cursor:pointer;transition:background var(--dur-fast) var(--ease)" onmouseover="this.style.background='var(--ink-2)'" onmouseout="this.style.background='var(--ink)'">Start a Conversation</button><div class="mono">--dur-fast 120ms · --dur 200ms<br>--ease cubic-bezier(.2,.7,.2,1)<br>nothing moves or scales</div></div></body></html>
